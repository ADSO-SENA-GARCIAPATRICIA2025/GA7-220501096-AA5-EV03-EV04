<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotos del producto - Footsy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="logo">Footsy</div>
            <nav>
                <a href="./index.html"><i class="bi bi-house"></i> Dashboard</a>
                <p class="menu-title">Tienda Virtual</p>
                <a href="./producto.html"><i class="bi bi-grid"></i> Productos</a>
                <div class="submenu-productos">
                    <a href="./variantes.html?productoId=1"><i class="bi bi-layers"></i> Variantes</a>
                    <a href="./fotoProducto.html?productoId=1" class="active"><i class="bi bi-images"></i> Fotos de productos</a>
                </div>
            </nav>
        </aside>

        <div class="content">
            <header class="topbar"><div class="user">PG</div></header>
            <main>
                <div class="page-header">
                    <div>
                        <h1>Fotos del producto</h1>
                        <p>Visualiza y administra las imágenes registradas.</p>
                    </div>
                    <a href="./producto.html" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Volver a productos
                    </a>
                </div>

                <section class="producto-resumen" id="resumenProducto">
                    <span>Cargando producto...</span>
                </section>

                <section class="product-panel">
                    <div class="panel-header">
                        <h2>Lista de fotos</h2>
                        <a id="nuevaFoto" class="btn btn-primary">
                            <i class="bi bi-plus-lg"></i> Nueva foto producto
                        </a>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Vista previa</th>
                                    <th>ID</th>
                                    <th>Orden</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="listaFotos"></tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>
    <script src="./js/fotoProducto.js"></script>
</body>
</html>
