<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tituloPagina">Editar variante - Footsy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <main class="main-content">
        <div class="page-header">
            <div>
                <h1 id="tituloFormulario">Editar variante</h1>
                <p id="descripcionFormulario">Actualiza la talla, el color, las existencias o el estado.</p>
            </div>
            <a id="volverVariantes" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Volver a variantes
            </a>
        </div>

        <div class="form-card">
            <form id="formVariante">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="talla">Talla</label>
                        <input id="talla" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="color">Color</label>
                        <input id="color" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="stockActual">Stock disponible</label>
                        <input type="number" id="stockActual" class="form-control" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="estadoActivo">Estado</label>
                        <select id="estadoActivo" class="form-select" required>
                            <option value="1">Activo</option>
                            <option value="0">Inactivo</option>
                        </select>
                    </div>
                </div>
                <div class="form-actions">
                    <a id="cancelarVariante" class="btn btn-outline-secondary">Cancelar</a>
                    <button class="btn btn-primary" type="submit" id="botonGuardar">
                        <i class="bi bi-floppy"></i> Guardar cambios
                    </button>
                </div>
            </form>
        </div>
    </main>
    <script src="./js/variante-form.js"></script>
</body>
</html>
